    align-items:center;

    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    background:#fff;
    color:var(--text);
    cursor:pointer;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;

    font-weight:600;

    margin-left:6px;
  }

  .card.hero .rev{

    font-weight:700;
    font-size:14px;
  }

    width:28px;
    height:28px;
    border-radius:8px;
    background:var(--orange-soft);
    color:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    font-size:14px;
  }

    color:var(--muted);
    font-size:11px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    font-weight:700;
  }

    font-weight:800;

    color:var(--text);
  }

  .card .rev{
    color:var(--muted);
    font-size:13px;
    font-weight:600;
  }

  .card .rev b{

  }

    display:grid;
    grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);
    gap:14px;
    margin-bottom:16px;
    align-items:start;
    visibility:visible;

  .panel{
    display:block;
    position:relative;

    border-radius:14px;
    border:1px solid var(--border);

    font-size:13px;
  }

    width:100%;
    overflow-x:auto;

  th{

    color:var(--muted);
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    padding:10px 14px;

  }

    height:100%;

  }

    font-weight:700;
  }

  .panel.dark{
    background:var(--navy);
    color:#fff;
  }

  .panel.dark .panel-title{
    border-color:#2a3050;
    color:#fff;
  }

  .dest-row{

    justify-content:space-between;
    align-items:center;
    padding:11px 18px;
    border-bottom:1px solid #262c48;
    font-size:13px;

    font-size:12px;

  }

  .chart-box{

    border:1px solid var(--border);

    min-width:0;

    height:320px;

  }

  .chart-box canvas{

    width:100% !important;

    }

/* ---------- Deterministic seeded RNG ---------- */

function seedFromString(str){

  let h = 0;

  for(let i = 0; i < str.length; i++){
    h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  }

  return () => {

    h = Math.imul(h ^ (h >>> 15), h | 1);

    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);

    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;

  };

}

function rngInt(rng, min, max){

  return Math.floor(
    rng() * (max - min + 1)
  ) + min;

}

/* ==========================================================
   SUPABASE RPC FUNCTION

   Schema:
   sales_dashboard

   Function:
   get_sales_dashboard

   Parameter:
   report_date date
========================================================== */

async function fetchRealData(dateStr){

  const controller = new AbortController();

  const timeoutId = setTimeout(
    () => controller.abort(),
    10000
  );

  try{

    const res = await fetch(

      API_CONFIG.baseUrl +
      "/rest/v1/rpc/get_sales_dashboard",

      {

        method: "POST",

        headers: {

          "apikey":
            API_CONFIG.apiKey,

          "Authorization":
            `Bearer ${API_CONFIG.apiKey}`,

          "Content-Type":
            "application/json",

          "Accept-Profile":
            "sales_dashboard",

          "Content-Profile":
            "sales_dashboard"

        },

        body: JSON.stringify({

          report_date: dateStr

        }),

        signal: controller.signal

      }

    );

    const responseText =
      await res.text();

    if(!res.ok){

      throw new Error(

        "API request failed: " +
        res.status +
        " " +
        responseText

      );

    }

    let result;

    try{

      result =
        JSON.parse(responseText);

    }catch(e){

      throw new Error(

        "Invalid JSON response from sales dashboard API: " +
        responseText

      );

    }

    console.log(
      "Raw get_sales_dashboard response:",
      result
    );

    return mapRpcResponse(
      result,
      dateStr
    );

  }finally{

    clearTimeout(timeoutId);

  }

}


/* ---------- Map API response ---------- */

function mapRpcResponse(row, dateStr){

  console.log(
    "get_sales_dashboard API response:",
    row
  );

  if(Array.isArray(row)){

    row =
      row[0] || {};

  }

  const daily =
    Array.isArray(row?.daily_metrics)
      ? row.daily_metrics
      : [];

  const monthly =
    Array.isArray(row?.month_metrics)
      ? row.month_metrics
      : [];

  const reps =
    Array.isArray(row?.sales_rep_metrics)
      ? row.sales_rep_metrics
      : [];

  const kpi =
    Array.isArray(row?.kpi_metrics)
      ? (row.kpi_metrics[0] || {})
      : {};

  console.log(
    "Leaderboard rows:",
    reps
  );

  const date =
    new Date(dateStr + "T00:00:00");


  const leaderboard = reps

    .map(r => ({

      name:
        r.sales_rep ||
        "Unknown",

      day:
        Number(r.tdy_sales || 0),

      mtd:
        Number(r.mtd_sales || 0),

      mtdRev:
        Number(r.mtd_revenue || 0),

      arpu:
        Number(r.mtd_sales)
          ? Math.round(
              Number(r.mtd_revenue || 0) /
              Number(r.mtd_sales)
            )
          : 0,

      target:
        125,

      pct:
        Math.min(
          140,
          Math.round(
            (Number(r.mtd_sales || 0) / 125) *
            100
          )
        ),

      pvMonth:
        r.pv_month ?? null

    }))

    .sort(
      (a, b) =>
        b.mtd - a.mtd
    );


  const dailyLabels = daily.map(d => {

    const value =
      d.order_date ||
      d.date;

    if(!value){

      return "";

    }

    const parsed =
      new Date(

        value +
        (
          String(value).includes("T")
            ? ""
            : "T00:00:00"

        )

      );

    return isNaN(
      parsed.getTime()
    )

      ? String(value)

      : parsed.toLocaleDateString(

          "en-IN",

          {
            day: "2-digit",
            month: "short"
          }

        );

  });


  const dailyValues = daily.map(

    d =>
      Number(
        d.no_of_sales || 0
      )

  );


  const monthlyLabels = monthly.map(m => {

    const month =
      Number(m.month);

    const year =
      Number(m.year);

    return month >= 1 &&
      month <= 12

      ? monthNames[month - 1] +
        " " +
        String(year).slice(-2)

      : String(
          m.month || ""
        );

  });


  const monthlyValues = monthly.map(

    m =>
      Number(
        m.no_of_sales || 0
      )

  );


  const rng =
    seedFromString(
      dateStr + "-dest"
    );

  const destData = destinations

    .map(d => ({

      name: d,

      count:
        rngInt(
          rng,
          8,
          240
        )

    }))

    .sort(
      (a, b) =>
        b.count - a.count
    )

    .slice(0, 7);


  return {

    todayOrders:
      Number(
        kpi.today_sales || 0
      ),

    todayRevenue:
      Number(
        kpi.today_revenue || 0
      ),

    mtdOrders:
      Number(
        kpi.mtd_sales || 0
      ),

    mtdRevenue:
      Number(
        kpi.mtd_revenue || 0
      ),

    prevSameDayOrders:
      Number(
        kpi.prev_month_same_day_sales || 0
      ),

    prevSameDayRevenue:
      Number(
        kpi.prev_month_same_day_revenue || 0
      ),

    prevMonthOrders:
      Number(
        kpi.prev_month_sales || 0
      ),

    prevMonthRevenue:
      Number(
        kpi.prev_month_revenue || 0
      ),

    leaderboard,

    destData,

    dailyLabels,

    dailyValues,

    monthlyLabels,

    monthlyValues,

    monthLabel:
      monthNames[
        date.getMonth()
      ]

  };

}


/* ---------- Fallback data ---------- */

function generateData(dateStr){

  const rng =
    seedFromString(
      dateStr
    );

  const date =
    new Date(
      dateStr +
      "T00:00:00"
    );

  const dayNum =
    date.getDate();


  const todayOrders =
    rngInt(
      rng,
      15,
      45
    );

  const todayRevenue =
    todayOrders *
    rngInt(
      rng,
      800,
      1100
    );

  const mtdOrders =
    rngInt(
      rng,
      dayNum * 15,
      dayNum * 24
    );

  const mtdRevenue =
    mtdOrders *
    rngInt(
      rng,
      850,
      900
    );

  const prevSameDayOrders =
    rngInt(
      rng,
      dayNum * 13,
      dayNum * 20
    );

  const prevSameDayRevenue =
    prevSameDayOrders *
    rngInt(
      rng,
      830,
      870
    );

  const prevMonthOrders =
    rngInt(
      rng,
      850,
      1050
    );

  const prevMonthRevenue =
    prevMonthOrders *
    rngInt(
      rng,
      800,
      880
    );


  let remainingMtd =
    mtdOrders;


  const leaderboard = salesReps

    .map(

      (name, i) => {

        const share =
          i === salesReps.length - 1

            ? Math.max(
                remainingMtd,
                0
              )

            : Math.floor(

                mtdOrders *
                (0.24 - i * 0.03) *
                (0.85 + rng() * 0.3)

              );


        remainingMtd -=
          share;


        const mtd =
          Math.max(
            share,
            5
          );

        const day =
          rngInt(
            rng,
            0,
            Math.max(
              2,
              Math.floor(
                mtd * 0.12
              )
            )
          );

        const mtdRev =
          mtd *
          rngInt(
            rng,
            780,
            1000
          );

        const arpu =
          Math.round(
            mtdRev /
            Math.max(
              mtd,
              1
            )
          );

        const target =
          125;

        const pct =
          Math.min(
            140,
            Math.round(
              (mtd / target) *
              100
            )
          );

        const pvMonth =
          rngInt(
            rng,
            0,
            90
          );


        return {

          name,

          day,

          mtd,

          mtdRev,

          arpu,

          target,

          pct,

          pvMonth

        };

      }

    )

    .sort(

      (a, b) =>
        b.mtd - a.mtd

    );


  const destData = destinations

    .map(d => ({

      name: d,

      count:
        rngInt(
          rng,
          8,
          240
        )

    }))

    .sort(

      (a, b) =>
        b.count - a.count

    )

    .slice(
      0,
      7
    );


  const dailyLabels = [];

  const dailyValues = [];


  for(

    let h = 1;

    h <= 18;

    h++

  ){

    dailyLabels.push(

      String(h)
        .padStart(
          2,
          "0"
        ) +
      ":00"

    );

    dailyValues.push(

      rngInt(
        rng,
        10,
        55
      )

    );

  }


  const monthlyLabels = [];

  const monthlyValues = [];

  let base =
    rngInt(
      rng,
      80,
      160
    );


  for(

    let m = 7;

    m >= 0;

    m--

  ){

    const d2 =
      new Date(

        date.getFullYear(),

        date.getMonth() - m,

        1

      );


    monthlyLabels.push(

      monthNames[
        d2.getMonth()
      ] +
      " " +
      String(
        d2.getFullYear()
      ).slice(2)

    );


    base =
      Math.max(

        60,

        base +
        rngInt(
          rng,
          -40,
          220
        )

      );


    monthlyValues.push(
      base
    );

  }


  return {

    todayOrders,

    todayRevenue,

    mtdOrders,

    mtdRevenue,

    prevSameDayOrders,

    prevSameDayRevenue,

    prevMonthOrders,

    prevMonthRevenue,

    leaderboard,

    destData,

    dailyLabels,

    dailyValues,

    monthlyLabels,

    monthlyValues,

    monthLabel:
      monthNames[
        date.getMonth()
      ]

  };

}

  ){

    throw new Error(

      "Chart.js failed to load. " +
      "Check the Chart.js CDN URL or network connection."

    );

  }

}


async function render(dateStr){

  ensureChartJsLoaded();


  let data;


  if(
    API_CONFIG.enabled
  ){

    try{

      data =
        await fetchRealData(
          dateStr
        );

    }catch(e){

      const message =
        e.name === "AbortError"

          ? "Dashboard API timed out after 10 seconds"

          : e.message;


      console.warn(

        "Dashboard API unavailable. " +
        "Using fallback data:",

        message

      );


      data =
        generateData(
          dateStr
        );

    }

  }else{

    data =
      generateData(
        dateStr
      );

  }


  document.getElementById(
    "todayOrders"
  ).innerHTML =

    data.todayOrders +
    "<small>Orders</small>";


  document.getElementById(
    "todayRevenue"
  ).textContent =

    "₹" +
    fmtK(
      data.todayRevenue
    ) +
    "K Revenue";


  document.getElementById(
    "mtdLabel"
  ).textContent =

    data.monthLabel +
    " MTD";


  document.getElementById(
    "mtdOrders"
  ).textContent =

    data.mtdOrders;


  document.getElementById(
    "mtdRevenue"
  ).textContent =

    fmtK(
      data.mtdRevenue
    );


  document.getElementById(
    "prevSameDayOrders"
  ).textContent =

    data.prevSameDayOrders;


  document.getElementById(
    "prevSameDayRevenue"
  ).textContent =

    fmtK(
      data.prevSameDayRevenue
    );


  document.getElementById(
    "prevMonthOrders"
  ).textContent =

    data.prevMonthOrders;


  document.getElementById(
    "prevMonthRevenue"
  ).textContent =

    fmtK(
      data.prevMonthRevenue
    );


  const lbBody =
    document.getElementById(
      "leaderboardBody"
    );


  if(
    !Array.isArray(
      data.leaderboard
    ) ||
    data.leaderboard.length === 0
  ){

    data.leaderboard =
      generateData(
        dateStr
      ).leaderboard;

  }


  if(
    !Array.isArray(
      data.monthlyLabels
    ) ||
    data.monthlyLabels.length === 0
  ){

    const fallback =
      generateData(
        dateStr
      );

    data.monthlyLabels =
      fallback.monthlyLabels;

    data.monthlyValues =
      fallback.monthlyValues;

  }


  if(
    !Array.isArray(
      data.dailyLabels
    ) ||
    data.dailyLabels.length === 0
  ){

    const fallback =
      generateData(
        dateStr
      );

    data.dailyLabels =
      fallback.dailyLabels;

    data.dailyValues =
      fallback.dailyValues;

  }


  lbBody.innerHTML =
    data.leaderboard

      .map(

        (r, i) => `

          <tr>

            <td class="rank">
              ${i + 1}
            </td>

            <td class="rep-name">
              ${r.name}
            </td>

            <td>

              ${r.day}

              <div class="rep-sub">

                ₹${(

                  r.mtdRev /
                  Math.max(
                    r.mtd,
                    1
                  ) /
                  1000

                ).toFixed(1)}

              </div>

            </td>

            <td class="mtd-num">
              ${r.mtd}
            </td>

            <td>
              ₹${(
                r.mtdRev / 1000
              ).toFixed(1)}K
            </td>

            <td>
              ₹${r.arpu}
            </td>

            <td>

              <div class="target-pct">
                ${r.pct}%
              </div>

              <div class="target-bar">

                <span
                  style="width:${Math.min(
                    r.pct,
                    100
                  )}%"
                ></span>

              </div>

              <div class="rep-sub">
                ${r.target}
              </div>

            </td>

            <td>

              ${
                r.pvMonth === null
                  ? "—"
                  : r.pvMonth
              }

            </td>

          </tr>

        `

      )

      .join("");


  const destList =
    document.getElementById(
      "destinationsList"
    );


  destList.innerHTML =
    data.destData

      .map(

        d => `

          <div class="dest-row">

            <span>
              ${d.name}
            </span>

            <span class="dest-count">
              ${d.count}
            </span>

          </div>

        `

      )

      .join("");


  const orange =
    "#f2601f";


  if(
    dailyChart
  ){

    dailyChart.destroy();

  }


  dailyChart =
    new Chart(

      document.getElementById(
        "dailyChart"
      ),

      {

        type:
          "bar",

        data: {

          labels:
            data.dailyLabels,

          datasets: [

            {

              data:
                data.dailyValues,

              backgroundColor:
                orange,

              borderRadius:
                4,

              barPercentage:
                0.7,

              categoryPercentage:
                0.8

            }

          ]

        },

        options: {

          plugins: {

            legend: {

              display:
                false

            }

          },

          scales: {

            x: {

              grid: {

                display:
                  false

              }

            },

            y: {

              beginAtZero:
                true,

              ticks: {

                precision:
                  0

              }

            }

          },

          responsive:
            true,

          maintainAspectRatio:
            false

        }

      }

    );


  if(
    monthlyChart
  ){

    monthlyChart.destroy();

  }


  monthlyChart =
    new Chart(

      document.getElementById(
        "monthlyChart"
      ),

      {

        type:
          "line",

        data: {

          labels:
            data.monthlyLabels,

          datasets: [

            {

              data:
                data.monthlyValues,

              borderColor:
                orange,

              backgroundColor:
                "rgba(242,96,31,0.08)",

              tension:
                0.35,

              fill:
                true,

              pointRadius:
                3,

              pointBackgroundColor:
                orange

            }

          ]

        },

        options: {

          plugins: {

            legend: {

              display:
                false

            }

          },

          scales: {

            x: {

              grid: {

                display:
                  false

              }

            },

            y: {

              beginAtZero:
                true,

              ticks: {

                precision:
                  0

              }

            }

          },

          responsive:
            true,

          maintainAspectRatio:
            false

        }

      }

    );


  window._lastData =
    data;

  window._lastDate =
    dateStr;

}


/* ---------- CSV Download ---------- */

function downloadCSV(){

  const data =
    window._lastData;

  if(!data)
    return;


  let csv =
    "Rank,Sales Rep,Day,MTD,MTD Revenue,ARPU,Target %,PV Month\n";


  data.leaderboard.forEach(

    (r, i) => {

      csv +=

        `${i + 1},` +
        `${r.name},` +
        `${r.day},` +
        `${r.mtd},` +
        `${r.mtdRev},` +
        `${r.arpu},` +
        `${r.pct}%,` +
        `${r.pvMonth === null ? "" : r.pvMonth}\n`;

    }

  );


  const blob =
    new Blob(

      [csv],

      {
        type:
          "text/csv"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    `voyx-leaderboard-${window._lastDate}.csv`;

  a.click();


  URL.revokeObjectURL(
    url
  );

}


/* ---------- Page Events ---------- */

const dateInput =
  document.getElementById(
    "dashDate"
  );

const today =
  new Date();


dateInput.value =
  today.toISOString()
    .slice(
      0,
      10
    );


dateInput.addEventListener(

  "change",

  () =>
    render(
      dateInput.value
    )

);


document.getElementById(
  "downloadCsv"
).addEventListener(

  "click",

  downloadCSV

);


render(
  dateInput.value
).catch(

  error => {

    console.error(
      "Dashboard render failed:",
      error
    );

  }

);

</script>
